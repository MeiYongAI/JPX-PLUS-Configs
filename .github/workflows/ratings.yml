name: Update configuration ratings
on:
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  ratings:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '<!-- JPX-PLUS-RATING:') ||
      startsWith(github.event.changes.body.from, '<!-- JPX-PLUS-RATING:')))
    concurrency:
      group: configuration-catalog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/run-ratings.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
